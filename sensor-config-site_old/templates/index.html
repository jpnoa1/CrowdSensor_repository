<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sensor Configuration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;max-width:980px;margin:24px auto;padding:0 12px}
    fieldset{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
    label{display:block;margin:8px 0}
    input,select,button{padding:8px;font-size:15px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{margin-top:8px}
    .errors{background:#fde8e8;border:1px solid #f5a6a6;border-radius:10px;padding:10px;margin:12px 0}
    .errors li{margin-left:18px}
  </style>
</head>
<body>
  <h1>Sensor Configuration</h1>

  {% if errors and errors|length %}
    <div class="errors">
      <strong>Please fix the following errors:</strong>
      <ul>
        {% for e in errors %}
          <li>{{ e }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post" action="{{ url_for('save') }}">
     <fieldset>
      <legend>Wi-Fi (optional)</legend>
      <div class="grid">
        <label>WiFi SSID
          <input name="WiFi SSID" value="{{ cfg['WiFi SSID'] }}">
        </label>
        <label>WiFi Password
          <input name="WiFi Password" type="password" value="{{ cfg['WiFi Password'] }}">
        </label>
      </div>
    </fieldset>
    
    <fieldset>
      <legend>Device</legend>
      <label>TTN Device ID
        <input name="TTN Device ID" value="{{ cfg['TTN Device ID'] }}"
               required pattern="^[a-z0-9-]{2,64}$" maxlength="64">
      </label>
      <div class="grid">
        <label>Latitude
          <input name="Latitude" type="number" step="any" min="-90" max="90"
                 value="{{ cfg['Latitude'] }}" required>
        </label>
        <label>Longitude
          <input name="Longitude" type="number" step="any" min="-180" max="180"
                 value="{{ cfg['Longitude'] }}" required>
        </label>
      </div>
      <label>Status
        <select name="Status" required>
          <option value="Active"  {{ "selected" if cfg['Status']=="Active" else "" }}>Active</option>
          <option value="disabled" {{ "selected" if cfg['Status']=="disabled" else "" }}>Disabled</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Processing</legend>
      <label>Power Filtration (dB)
        <input name="Power Filtration" type="number" step="any"
               value="{{ cfg['Power Filtration'] }}" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>Server / InfluxDB</legend>
      <label>Cloud IP Address
        <input name="Cloud IP Address" value="{{ cfg['Cloud IP Address'] }}" required>
      </label>
      <div class="grid">
        <label>InfluxDB Organization
          <input name="InfluxDB Organization" value="{{ cfg['InfluxDB Organization'] }}" required>
        </label>
        <label>InfluxDB Bucket
          <input name="InfluxDB Bucket" value="{{ cfg['InfluxDB Bucket'] }}" required>
        </label>
      </div>
      <label>InfluxDB Auth Token
        <input type="password" name="InfluxDB Auth Token"
               value="{{ cfg['InfluxDB Auth Token'] }}" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>Upload & Windows</legend>
      <div class="grid">
        <label>Upload Periodicity (minutes)
          <input type="number" min="1" step="1" name="Upload Periodicity"
                 value="{{ cfg['Upload Periodicity'] }}" required>
        </label>
        <label>Sliding Window (minutes)
          <input type="number" min="1" step="1" name="Sliding Window"
                 value="{{ cfg['Sliding Window'] }}" required>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Reboot</legend>
      <div class="grid">
        <label>Reboot Periodicity
          <select name="Reboot Periodicity" id="reboot_periodicity" required>
            <option value="0" {{ "selected" if cfg['Reboot Periodicity']=="0" else "" }}>0 - Daily</option>
            <option value="1" {{ "selected" if cfg['Reboot Periodicity']=="1" else "" }}>1 - Every two days</option>
            <option value="2" {{ "selected" if cfg['Reboot Periodicity']=="2" else "" }}>2 - Every three days</option>
            <option value="3" {{ "selected" if cfg['Reboot Periodicity']=="3" else "" }}>3 - Weekly</option>
            <option value="4" {{ "selected" if cfg['Reboot Periodicity']=="4" else "" }}>4 - Monthly</option>
            <option value="5" {{ "selected" if cfg['Reboot Periodicity']=="5" else "" }}>5 - No Reboot</option>
          </select>
        </label>
        <label>Reboot Time (HH:MM)
          <input type="time" name="Reboot Time" id="reboot_time"
                 value="{{ cfg['Reboot Time'] }}">
        </label>
      </div>
      <small>If “No Reboot (5)” is selected, time is ignored.</small>
    </fieldset>

    <div class="actions">
      <button type="submit">Save</button>
    </div>
  </form>

  <script>
    // Reboot time required only when periodicity != 5
    const rp = document.getElementById('reboot_periodicity');
    const rt = document.getElementById('reboot_time');
    function syncTime() {
      const noReboot = rp.value === "5";
      rt.disabled  = noReboot;
      rt.required  = !noReboot;
    }
    rp.addEventListener('change', syncTime);
    syncTime();
  </script>
</body>
</html>
